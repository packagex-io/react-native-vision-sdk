name: Release

# Fires on every push to `main` (which is what PR merges create, regardless of
# whether you squash, rebase, or merge-commit), and on manual workflow_dispatch.
# Loop guard further down skips the release commit release-it itself creates.
on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (leave empty to use conventional commits)"
        required: false
        type: choice
        options:
          - ""
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip release commits to avoid infinite loop
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_TOKEN is a PAT/GitHub App token allowed to bypass branch
          # protection on main. The default GITHUB_TOKEN cannot: release-it
          # pushes the version commit + tag directly to main, and protection
          # rejects it with GH006 ("Changes must be made through a pull
          # request") -- AFTER `npm publish` has already run, leaving npm ahead
          # of git with no tag (this is what happened to 3.14.0 on 2026-08-05).
          # Falls back to GITHUB_TOKEN so the checkout still works for CI runs
          # that never reach the push step.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Pinned to the 11.x line, not @latest: npm 12.0.0 (released 2026-07-08)
      # shipped with a packaging bug where the `sigstore` module is missing
      # from the published npm-12.0.0.tgz even though libnpmpublish still
      # requires it for provenance/trusted publishing, crashing every publish
      # with `Cannot find module 'sigstore'`. 11.x still bundles it correctly.
      # Upstream bug: https://github.com/npm/cli/issues/9722 (open, unfixed).
      - name: Upgrade npm for trusted publishing
        run: sudo npm install -g npm@11

      - name: Build package
        run: yarn prepare

      # When `release_type` is set (manual dispatch), use it. Otherwise let
      # release-it's conventional-changelog plugin pick the bump from commit
      # messages — `feat:` → minor, `fix:` → patch, `BREAKING CHANGE:` → major.
      # Hardcoding `patch` previously masked `feat:` commits that should have
      # been minor releases.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_type }}" ]; then
            yarn release "${{ inputs.release_type }}" --ci
          else
            yarn release --ci
          fi
